name: ci

# Public repo: standard runners are free. PRs + main only, so a PR push runs once.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@v2
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      # TestMD2PDF skips here (no wkhtmltopdf); it runs on the VPS before deploy.
      - run: go test ./...
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit -p jsconfig.json
      - run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /dev/null .
